name: Android Emulator RobotFramework Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Create and start Android Emulator
      run: |
        echo "y" | sdkmanager "system-images;android-30;google_apis;x86_64"
        echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64" --device "pixel"
        emulator -avd test -no-window -no-audio -no-boot-anim &
        # Wait for the emulator to start
        adb wait-for-device
        adb shell input keyevent 82
        adb devices

    - name: Install dependencies (Robot Framework + Appium)
      run: |
        sudo apt update
        sudo apt install -y python3-pip
        pip3 install robotframework Appium-Python-Client robotframework-appiumlibrary

    - name: Run Appium Server
      run: |
        npm install -g appium
        appium driver install uiautomator2
        appium driver --list
        appium --log-level error &

    - name: Run Robot Tests
      run: |
        robot tests/
