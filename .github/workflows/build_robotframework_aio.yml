name: Android Emulator RobotFramework Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Set up AVD directories
      run: |
        mkdir -p $HOME/.android/avd
        echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> $GITHUB_ENV

    - name: Create and start Android Emulator
      run: |
        echo "Installing sdk ..."
        echo "y" | sdkmanager "system-images;android-30;google_apis;x86_64"
        echo "Creating 'test' avd ..."
        echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64" --device "pixel"

        # Add emulator and tools to PATH
        echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

        # Reload PATH in current shell
        export PATH=$PATH:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin

        # Verify emulator
        emulator -list-avds

        # Start emulator
        emulator -avd test -no-audio -no-window -no-boot-anim &
        adb wait-for-device
        # Wait until system boot is complete
        boot_completed=""
        until [[ "$boot_completed" == "1" ]]; do
          sleep 5
          boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
          echo "Waiting for boot... (boot_completed=$boot_completed)"
        done

        # Now it's safe to send input commands
        adb shell input keyevent 82

        # Check adb device
        adb devices

    - name: Install dependencies (Robot Framework + Appium)
      run: |
        sudo apt update
        sudo apt install -y python3-pip
        pip3 install robotframework Appium-Python-Client robotframework-appiumlibrary

    - name: Run Appium Server
      run: |
        npm install -g appium
        appium driver install uiautomator2
        appium driver --list
        appium --log-level error &

    - name: Run Robot Tests
      run: |
        robot tests/
